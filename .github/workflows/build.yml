name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep the same debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Publish French speech model once (downloaded by the app on first use)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view models >/dev/null 2>&1; then
            curl -fL --retry 3 -o vosk-model-small-fr-0.22.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
            gh release create models vosk-model-small-fr-0.22.zip --title "Modeles vocaux" --notes "Vosk small fr 0.22 (Apache 2.0), telecharge par l'application a la premiere utilisation."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: releve-clavier-apk
          path: app/build/outputs/apk/debug/*.apk
