plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartkeyboard.releve'
    compileSdk 34

    defaultConfig {
        applicationId 'com.smartkeyboard.releve'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
}
